{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h3>🩺 Medical Record for {{ pet.name }}</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'pets:pet_detail' pet.id %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
