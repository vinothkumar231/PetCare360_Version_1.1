{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5 class="fw-bold mb-3">🩺 Add Medical Record for {{ pet.name }}</h5>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save Record</button>
        <a href="{% url 'pets:owner_dashboard' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
