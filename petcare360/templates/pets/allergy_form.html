{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h5 class="fw-bold mb-3">
      {% if form.instance.pk %}✏️ Edit Allergy{% else %}➕ Add Allergy{% endif %}
    </h5>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">
        {% if form.instance.pk %}Update{% else %}Save{% endif %}
      </button>
    </form>
  </div>
</div>
{% endblock %}
