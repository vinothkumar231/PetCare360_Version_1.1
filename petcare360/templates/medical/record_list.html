{% extends "base.html" %}
{% block content %}
<h2>Medical Records</h2>
<ul>
  {% for record in records %}
    <li>
      <a href="{% url 'medical_detail' record.pk %}">
        {{ record.pet.name }} — {{ record.record_type }} ({{ record.condition }})
      </a>
    </li>
  {% empty %}
    <li>No medical records yet.</li>
  {% endfor %}
</ul>
{% endblock %}
