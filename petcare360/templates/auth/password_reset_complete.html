{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header bg-success text-white text-center py-4">
                    <h3 class="mb-0">
                        <i class="fas fa-check-circle me-2"></i>
                        Password Reset Complete
                    </h3>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="fas fa-lock-open fa-4x text-success mb-3"></i>
                        <p class="lead">Your password has been successfully reset!</p>
                    </div>
                    
                    <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
                        <i class="fas fa-info-circle me-2"></i>
                        <div>
                            You can now log in with your new password.
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <a href="{% url 'login' %}" class="btn btn-success btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Proceed to Login
                        </a>
                    </div>
                </div>
                <div class="card-footer bg-light text-muted text-center py-3">
                    <small>
                        <i class="fas fa-clock me-1"></i>
                        Session expires in 24 hours
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        transition: transform 0.2s ease-in-out;
    }
    .card:hover {
        transform: translateY(-5px);
    }
    .btn-success {
        background-color: #28a745;
        border-color: #28a745;
    }
    .btn-success:hover {
        background-color: #218838;
        border-color: #1e7e34;
    }
    .fa-check-circle, .fa-lock-open {
        filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
    }
</style>
{% endblock %}
