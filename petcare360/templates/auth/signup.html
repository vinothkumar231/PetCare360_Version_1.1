{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetCare 360 | Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #2b7a78;
      --primary-light: #4fa3a0;
      --bg-gradient-start: #d9fdd3;
      --bg-gradient-end: #cce7ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .signup-card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 15px 30px rgba(43, 122, 120, 0.12);
      padding: 2rem 1.8rem;
      width: 100%;
      transition: transform 0.2s ease;
    }

    .signup-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 35px rgba(43, 122, 120, 0.15);
    }
    
    /* Brand Section */
    .brand-section {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    
    .brand-icon {
      font-size: 2.2rem;
      color: var(--primary);
      background: rgba(43, 122, 120, 0.1);
      width: 70px;
      height: 70px;
      line-height: 70px;
      border-radius: 20px;
      margin: 0 auto 0.8rem;
    }
    
    .brand-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1.2;
    }
    
    .brand-title span {
      color: var(--primary);
    }
    
    .brand-subtitle {
      color: #6c757d;
      font-size: 0.8rem;
    }
    
    /* Form Groups */
    .form-group {
      margin-bottom: 1rem;
    }
    
    .form-label {
      font-weight: 500;
      color: #2c3e50;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
      display: block;
    }
    
    .input-group-custom {
      position: relative;
    }
    
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9bbfb8;
      font-size: 0.9rem;
      z-index: 1;
    }
    
    .form-control {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 42px;
      border: 1.5px solid #e9ecef;
      border-radius: 14px;
      font-size: 0.9rem;
      background: white;
      transition: all 0.2s ease;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(43, 122, 120, 0.1);
    }
    
    .form-control::placeholder {
      color: #adb5bd;
      font-size: 0.85rem;
    }
    
    /* Password field */
    .password-wrapper {
      position: relative;
    }
    
    .password-wrapper .form-control {
      padding-right: 45px;
    }
    
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9bbfb8;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s ease;
    }
    
    .password-toggle:hover {
      color: var(--primary);
    }
    
    /* Password requirement chips */
    .requirement-chips {
      display: flex;
      gap: 10px;
      margin: 0.6rem 0 1rem 0;
    }
    
    .chip {
      background: #e5efec;
      color: #547a74;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    
    .chip i {
      font-size: 0.6rem;
    }
    
    .chip.valid {
      background: #3a8b7c;
      color: white;
    }
    
    /* Row actions */
    .row-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 1rem 0 1.2rem 0;
    }
    
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .checkbox-wrapper input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    
    .checkbox-wrapper label {
      color: #495057;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    
    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    
    .forgot-link:hover {
      color: #205d5c;
    }
    
    .forgot-link i {
      font-size: 0.65rem;
    }
    
    /* Create Account button */
    .btn-create {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      font-weight: 600;
      padding: 0.85rem;
      border-radius: 14px;
      border: none;
      width: 100%;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    
    .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(43, 122, 120, 0.2);
    }
    
    .btn-create i {
      font-size: 0.9rem;
    }
    
    /* Login link */
    .login-link {
      text-align: center;
      margin: 0.5rem 0;
    }
    
    .login-link a {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    
    .login-link a:hover {
      color: #205d5c;
      text-decoration: underline;
    }
    
    .login-link a i {
      font-size: 0.8rem;
    }
    
    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 1rem 0;
      color: #6c757d;
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e9ecef;
    }

    .divider span {
      padding: 0 0.8rem;
    }
    
    /* Security badge */
    .security-badge {
      text-align: center;
      color: #6c757d;
      font-size: 0.7rem;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .security-badge i {
      font-size: 0.65rem;
      color: var(--primary);
    }
    
    /* Windows text */
    .windows-text {
      text-align: center;
      color: #6c757d;
      font-size: 0.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding-top: 0.8rem;
      margin-top: 0.5rem;
      border-top: 1px solid #e9ecef;
    }
    
    .windows-text i {
      font-size: 0.55rem;
    }
    
    /* Error message */
    .error-message {
      background: rgba(220, 53, 69, 0.08);
      color: #dc2626;
      padding: 0.7rem;
      border-radius: 12px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }
    
    .btn-loading {
      pointer-events: none;
      opacity: 0.7;
    }
    
    /* Responsive */
    @media (max-width: 560px) {
      .container {
        max-width: 420px;
      }
      
      .signup-card {
        padding: 1.5rem;
      }
      
      .brand-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="signup-card">
      
      <!-- Brand Section -->
      <div class="brand-section">
        <div class="brand-icon">
          <i class="fas fa-paw"></i>
        </div>
        <div class="brand-title">
          PetCare <span>360</span>
        </div>
        <div class="brand-subtitle">Caring for your pets</div>
      </div>
      
      <!-- Error message -->
      <div id="errorMessage" class="error-message" style="display: none;">
        <i class="fas fa-exclamation-circle"></i>
        <span>Passwords do not match</span>
      </div>
      
      <form method="post" id="signupForm" autocomplete="off">
        {% csrf_token %}
        
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-group-custom">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" name="fullname" placeholder="Enter your full name" autocomplete="off" required>
          </div>
        </div>
        
        <!-- Email Address -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-group-custom">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-control" name="email" placeholder="Enter your email" autocomplete="off" required>
          </div>
        </div>
        
        <!-- Username -->
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-group-custom">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" name="username" placeholder="Choose a username" autocomplete="off" required>
          </div>
        </div>
        
        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <i class="fas fa-lock input-icon" style="left: 14px;"></i>
            <input type="password" class="form-control" id="password1" name="password1" placeholder="Create a password" autocomplete="new-password" required>
            <span class="password-toggle" onclick="togglePassword('password1')">
              <i class="far fa-eye" id="toggleIcon1"></i>
            </span>
          </div>
        </div>
        
        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="password-wrapper">
            <i class="fas fa-lock input-icon" style="left: 14px;"></i>
            <input type="password" class="form-control" id="password2" name="password2" placeholder="Confirm your password" autocomplete="new-password" required>
            <span class="password-toggle" onclick="togglePassword('password2')">
              <i class="far fa-eye" id="toggleIcon2"></i>
            </span>
          </div>
        </div>
        
        <!-- Password requirement chips -->
        <div class="requirement-chips">
          <span class="chip" id="chip-length">
            <i class="fas fa-circle"></i> 8+ chars
          </span>
          <span class="chip" id="chip-match">
            <i class="fas fa-circle"></i> Match
          </span>
        </div>
        
        <!-- Remember me -->
        <div class="row-actions">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
          </div>
        </div>
        
        <!-- Create Account button -->
        <button type="submit" class="btn-create" id="submitBtn">
          <i class="fas fa-paw"></i> Create account
        </button>
        
        <!-- Divider -->
        <div class="divider">
          <span>Already have an account?</span>
        </div>
        
        <!-- Login link with small paw logo -->
        <div class="login-link">
          <a href="{% url 'pets:login' %}">
            <i class="fas fa-paw"></i> Login here
          </a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      const icon = document.getElementById(`toggleIcon${fieldId === 'password1' ? '1' : '2'}`);
      
      if (field.type === 'password') {
        field.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
    
    // Clear all form fields on page load
    window.addEventListener('load', function() {
      const form = document.getElementById('signupForm');
      const inputs = form.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]');
      inputs.forEach(input => {
        input.value = '';
      });
    });
    
    // Password validation
    const password1 = document.getElementById('password1');
    const password2 = document.getElementById('password2');
    const chipLength = document.getElementById('chip-length');
    const chipMatch = document.getElementById('chip-match');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMessage');
    
    function validatePasswords() {
      const isValidLength = password1.value.length >= 8;
      const doMatch = password2.value === password1.value && password1.value !== '';
      
      if (isValidLength) {
        chipLength.classList.add('valid');
        const icon = chipLength.querySelector('i');
        icon.classList.remove('fa-circle');
        icon.classList.add('fa-check-circle');
      } else {
        chipLength.classList.remove('valid');
        const icon = chipLength.querySelector('i');
        icon.classList.remove('fa-check-circle');
        icon.classList.add('fa-circle');
      }
      
      if (doMatch) {
        chipMatch.classList.add('valid');
        const icon = chipMatch.querySelector('i');
        icon.classList.remove('fa-circle');
        icon.classList.add('fa-check-circle');
      } else {
        chipMatch.classList.remove('valid');
        const icon = chipMatch.querySelector('i');
        icon.classList.remove('fa-check-circle');
        icon.classList.add('fa-circle');
      }
      
      return isValidLength && doMatch;
    }
    
    password1.addEventListener('input', validatePasswords);
    password2.addEventListener('input', validatePasswords);
    
    // Form submission with validation
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      if (!validatePasswords()) {
        e.preventDefault();
        errorMsg.style.display = 'flex';
        if (password1.value.length < 8) {
          errorMsg.querySelector('span').textContent = 'Password must be at least 8 characters long!';
        } else if (password1.value !== password2.value) {
          errorMsg.querySelector('span').textContent = 'Passwords do not match!';
        }
        
        setTimeout(() => {
          errorMsg.style.display = 'none';
        }, 3000);
      } else {
        submitBtn.classList.add('btn-loading');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      }
    });
  </script>
</body>
</html>
