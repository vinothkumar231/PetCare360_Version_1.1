<!DOCTYPE html>
<html>
<head>
    <title>Pet Care Recommender</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .btn { padding: 8px 15px; background: green; color: white; border: none; border-radius: 5px; cursor: pointer; }
        input[type=text] { width: 300px; padding: 8px; }
    </style>
</head>
<body>
    <h2>🐾 Pet Care Recommendation System</h2>
    
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="symptom" placeholder="Enter pet symptom..." value="{{ query }}">
        <button class="btn">Get Recommendations</button>
    </form>
    
    {% if recommendations %}
        <h3>Top Recommendations:</h3>
        {% for rec in recommendations %}
            <div class="card">
                <b>Text:</b> {{ rec.text }} <br>
                <b>Condition:</b> {{ rec.condition }} <br>
                <b>Record Type:</b> {{ rec.record_type }} <br>
            </div>
        {% endfor %}
    {% endif %}
</body>
</html>
